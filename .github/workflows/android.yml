name: Android app (APK + Play Store AAB)

on:
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "app/**", "build.py", "vendor/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build game (web files)
        run: python3 build.py --site

      - name: Prepare Capacitor Android project
        working-directory: app
        run: |
          npm ci || npm install
          rm -rf www && cp -r ../dist/site www
          npx cap sync android

      - name: Restore upload keystore (if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with upload key"
          else
            echo "No KEYSTORE_BASE64 secret: building debug APK only"
          fi

      - name: Build APK and AAB
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../../out
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../../out/india-run.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../out/india-run-playstore.aab
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../out/india-run.apk
          fi
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: india-run-android-${{ env.VERSION_NAME }}
          path: out/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest out/* \
            --title "India Run Android ${{ env.VERSION_NAME }}" \
            --notes "Download india-run.apk to install on an Android phone. india-run-playstore.aab (when present) is the file to upload to Google Play Console." \
            --latest

      - name: Upload to itch.io (if BUTLER_API_KEY and ITCH_GAME are set)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then echo "itch.io upload skipped (secrets not set)"; exit 0; fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push dist/site "$ITCH_GAME:html5" --userversion "$VERSION_NAME"
          ./butler/butler push out/india-run.apk "$ITCH_GAME:android" --userversion "$VERSION_NAME"
